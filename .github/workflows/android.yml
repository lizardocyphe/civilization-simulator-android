name: Build Civilization Simulator APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check project ZIP
        run: |
          ls -la
          test -f civilization-simulator-android-project.zip

      - name: Extract project
        run: |
          unzip -q civilization-simulator-android-project.zip
          test -f civilis-android/app/build.gradle

      - name: Build APK
        run: |
          cd civilis-android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Civilization-Simulator-APK
          path: civilis-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
